<!DOCTYPE html>
<html>
<head>
<title>Add Employee</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
body {
    background: #f4f6f9;
}
.form-card {
    max-width: 600px;
    margin: auto;
    margin-top: 50px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.1);
}
</style>
</head>
<body>
<div class="card form-card p-4">
<h3 class="mb-3">Add Employee</h3>
<form id="addEmployeeForm">
<input class="form-control mb-2" type="text" name="name" placeholder="Name" required>
<input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
<input class="form-control mb-2" type="text" name="country" placeholder="Country" required>
<input class="form-control mb-2" type="text" name="city" placeholder="City" required>
<input class="form-control mb-2" type="text" name="street" placeholder="Street" required>
<input class="form-control mb-2" type="text" name="holder" placeholder="Holder Name" required>
<input class="form-control mb-2" type="text" name="account" placeholder="Account Number" required>
<input class="form-control mb-3" type="number" step="0.01" name="salary" placeholder="Salary" required>
<div class="d-flex gap-2">
<a href="admin_dashboard.html" class="btn btn-outline-secondary">
<i class="bi bi-arrow-left"></i> Back
</a>
<button class="btn btn-success flex-fill">Add Employee</button>
</div>
<input type="hidden" name="action" value="add">
</form>
</div>
<script src="../js/mock-store.js"></script>
<script>
document.getElementById("addEmployeeForm").onsubmit = function (e) {
    e.preventDefault();
    const f = e.target;
    MockStore.addEmployee({
        name: f.name.value,
        email: f.email.value,
        country: f.country.value,
        city: f.city.value,
        street: f.street.value,
        holder: f.holder.value,
        account: f.account.value,
        salary: f.salary.value
    });
    window.location.href = "admin_dashboard.html";
};
</script>
</body>
</html>
