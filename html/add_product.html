<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { background:#f4f6f9 }
.card {
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.08)
}
</style>
</head>
<body>
<div class="container py-4">
<div class="d-flex justify-content-between mb-3">
    <h2>Products</h2>
    <div class="d-flex gap-2">
        <a href="admin_dashboard.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <button class="btn btn-success" onclick="openAdd()">Add Product</button>
    </div>
</div>
<div class="d-flex mb-4">
    <input class="form-control me-2" id="searchInput" placeholder="Search product or color...">
    <button class="btn btn-outline-secondary" onclick="clearSearch()">Clear</button>
</div>
<div class="row" id="productGrid"></div>
</div>
<!-- ADD / EDIT MODAL -->
<div class="modal fade" id="productModal">
<div class="modal-dialog">
<div class="modal-content">
<form id="productForm">
<div class="modal-header">
    <h5 id="modalTitle">Add Product</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <input type="hidden" id="productId">
    <input class="form-control mb-2" id="productName"
           placeholder="Product Name" required>
    <input class="form-control mb-2" id="productPrice"
           type="number" min="0" step="0.01"
           placeholder="Price" required>
    <input class="form-control mb-2" id="productColor"
           placeholder="Color" required>
</div>
<div class="modal-footer">
    <button class="btn btn-success">Save</button>
</div>
</form>
</div>
</div>
</div>
<script src="../js/mock-store.js"></script>
<script>
let products = [];
let mode = "add";
products = MockStore.getProducts();
renderProducts(products);
function renderProducts(data){
    productGrid.innerHTML = "";
    data.forEach(p => {
        productGrid.innerHTML += `
        <div class="col-md-4 mb-3">
            <div class="card p-3">
                <h5>${p.NAME}</h5>
                <p class="mb-1">Price: ${p.PRICE}</p>
                <p class="mb-2">Color: ${p.COLOR}</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary w-100"
                        onclick="openEdit(${p.PID},'${p.NAME}',${p.PRICE},'${p.COLOR}')">
                        Edit
                    </button>
                    <button class="btn btn-danger"
                        onclick="deleteProduct(${p.PID})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>`;
    });
}
function openAdd(){
    mode = "add";
    modalTitle.innerText = "Add Product";
    productForm.reset();
    productId.value = "";
    new bootstrap.Modal(productModal).show();
}
function openEdit(id,name,price,color){
    mode = "update";
    modalTitle.innerText = "Edit Product";
    productId.value = id;
    productName.value = name;
    productPrice.value = price;
    productColor.value = color;
    new bootstrap.Modal(productModal).show();
}
productForm.onsubmit = e => {
    e.preventDefault();
    if (mode === "add") {
        MockStore.addProduct({
            name: productName.value,
            price: productPrice.value,
            color: productColor.value
        });
    } else {
        MockStore.updateProduct({
            id: productId.value,
            name: productName.value,
            price: productPrice.value,
            color: productColor.value
        });
    }
    location.reload();
};
function deleteProduct(id){
    if(!confirm("Are you sure you want to delete this product?")) return;
    MockStore.deleteProduct(id);
    location.reload();
}
searchInput.onkeyup = () => {
    const v = searchInput.value.toLowerCase();
    renderProducts(
        products.filter(p =>
            p.NAME.toLowerCase().includes(v) ||
            p.COLOR.toLowerCase().includes(v)
        )
    );
};
function clearSearch(){
    searchInput.value = "";
    renderProducts(products);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
